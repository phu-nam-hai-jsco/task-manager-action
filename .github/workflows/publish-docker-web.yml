name: Docker Publish Web Build
run-name: "${{ github.workflow }} · ${{ github.sha }}"
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# Build image Web (Next.js static export + nginx) từ `docker/nextjs/Dockerfile` (COPY `frontend/**`).

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      version:
        description: 'Version to tag the image with (fallback: root package.json → "dev")'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần build (mặc định: repo caller; task-manager-packages truyền task-manager)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Branch name for image lane tagging (default: main lane, no prefix)'
        type: string
        required: false
        default: 'main'
      env_json:
        description: 'JSON object of non-secret build env (BUILD_ENV, NEXT_PUBLIC_*, SENTRY_*) — khóa AG Grid license / Sentry OBS token gửi qua secrets'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_TOKEN:
        description: 'PAT with repo scope to checkout private submodules + main repo'
        required: false
      GHCR_TOKEN:
        description: 'Optional PAT with write:packages to push to GHCR (fallback: MAIN_REPO_CHECKOUT_TOKEN, then GITHUB_TOKEN)'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: 'Optional PAT fallback for checkout + GHCR login'
        required: false
      AG_GRID_LICENSE:
        description: 'Optional AG Grid license key (NEXT_PUBLIC_AG_GRID_LICENSE build arg)'
        required: false
      SENTRY_OBS_API_TOKEN:
        description: 'Optional Sentry OBS API token (SENTRY_OBS_API_TOKEN build arg)'
        required: false

# Group theo image + nguồn build (repo/branch/ref/version/PR): các image khác nhau
# (server/web/migrator) hoặc lane khác nhau chạy SONG SONG. `github.workflow` trong
# reusable workflow là tên workflow của caller nên không dùng làm key; chỉ hủy run
# trùng hệt cùng một build.
concurrency:
  group: publish-docker-web-${{ inputs.source_repository || github.repository }}-${{ inputs.branch }}-${{ inputs.ref || github.sha }}-${{ inputs.version }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Ảnh publish về namespace của caller repo (GITHUB_TOKEN + packages:write đủ quyền push)
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}
          submodules: recursive

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Source: workflow input"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
            echo "Source: package.json"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Resolve lane prefix
        id: lane
        run: |
          BRANCH="${{ inputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ]; then
            # Dev lane: suffix vao TEN image (task-manager-server-dev), tag giu sach
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "prefix=${BRANCH}-" >> $GITHUB_OUTPUT
            echo "suffix=-${BRANCH}" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH"

      - name: Parse env_json
        id: env_json
        run: |
          ENV_JSON='${{ inputs.env_json }}'
          if [ -n "$ENV_JSON" ]; then
            echo "build_env=$(echo "$ENV_JSON" | jq -r '.BUILD_ENV // "production"')" >> $GITHUB_OUTPUT
            echo "next_public_api_base_url=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_API_BASE_URL // ""')" >> $GITHUB_OUTPUT
            echo "internal_api_base_url=$(echo "$ENV_JSON" | jq -r '.INTERNAL_API_BASE_URL // ""')" >> $GITHUB_OUTPUT
            echo "next_public_debug=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_DEBUG // "false"')" >> $GITHUB_OUTPUT
            echo "next_public_ag_grid_license=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_AG_GRID_LICENSE // ""')" >> $GITHUB_OUTPUT
            echo "sentry_dsn_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_DSN_WEB // ""')" >> $GITHUB_OUTPUT
            echo "sentry_traces_sample_rate_web_client=$(echo "$ENV_JSON" | jq -r '.SENTRY_TRACES_SAMPLE_RATE_WEB_CLIENT // "0.2"')" >> $GITHUB_OUTPUT
            echo "sentry_replay_session_sample_rate_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_REPLAY_SESSION_SAMPLE_RATE_WEB // "0.05"')" >> $GITHUB_OUTPUT
            echo "sentry_replay_on_error_sample_rate_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE_WEB // "1.0"')" >> $GITHUB_OUTPUT
            echo "sentry_obs_api_token=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_API_TOKEN // ""')" >> $GITHUB_OUTPUT
            echo "sentry_obs_organization_slug=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_ORGANIZATION_SLUG // ""')" >> $GITHUB_OUTPUT
            echo "sentry_obs_project_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_PROJECT_WEB // "web"')" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-web${{ steps.lane.outputs.name_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/task-manager-packages
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest${{ steps.lane.outputs.suffix }}
            type=raw,value=${{ steps.version.outputs.version }}${{ steps.lane.outputs.suffix }}
            type=sha,prefix=${{ steps.lane.outputs.prefix }}sha-,format=short

      - name: Build and push Web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nextjs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer deps (pnpm install) được giữ cache qua registry buildcache + gha
          # để không phải reinstall khi pnpm-lock.yaml không đổi.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-web${{ steps.lane.outputs.name_suffix }}:buildcache${{ steps.lane.outputs.suffix }}
            type=gha,mode=max,scope=publish-web
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-web${{ steps.lane.outputs.name_suffix }}:buildcache${{ steps.lane.outputs.suffix }},mode=max
            type=gha,mode=max,scope=publish-web
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_ENV=${{ steps.env_json.outputs.build_env }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.env_json.outputs.next_public_api_base_url }}
            INTERNAL_API_BASE_URL=${{ steps.env_json.outputs.internal_api_base_url }}
            NEXT_PUBLIC_DEBUG=${{ steps.env_json.outputs.next_public_debug }}
            NEXT_PUBLIC_AG_GRID_LICENSE=${{ secrets.AG_GRID_LICENSE || steps.env_json.outputs.next_public_ag_grid_license }}
            SENTRY_DSN_WEB=${{ steps.env_json.outputs.sentry_dsn_web }}
            SENTRY_TRACES_SAMPLE_RATE_WEB_CLIENT=${{ steps.env_json.outputs.sentry_traces_sample_rate_web_client }}
            SENTRY_REPLAY_SESSION_SAMPLE_RATE_WEB=${{ steps.env_json.outputs.sentry_replay_session_sample_rate_web }}
            SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE_WEB=${{ steps.env_json.outputs.sentry_replay_on_error_sample_rate_web }}
            SENTRY_OBS_API_TOKEN=${{ secrets.SENTRY_OBS_API_TOKEN || steps.env_json.outputs.sentry_obs_api_token }}
            SENTRY_OBS_ORGANIZATION_SLUG=${{ steps.env_json.outputs.sentry_obs_organization_slug }}
            SENTRY_OBS_PROJECT_WEB=${{ steps.env_json.outputs.sentry_obs_project_web }}

      - name: Summary
        run: |
          echo "## 🌐 Web Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-web${{ steps.lane.outputs.name_suffix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ inputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
