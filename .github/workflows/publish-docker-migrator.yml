name: Docker Publish Migrator Build
run-name: "${{ github.workflow }} · ${{ inputs.branch || github.event.client_payload.branch || 'main' }} · ${{ inputs.version || github.event.client_payload.version || 'auto' }} · ${{ inputs.ref || github.event.client_payload.ref || github.sha }}"
# Build image từ repo thành phần theo TÊN NHÁNH bắt buộc (ref) — không theo dõi repo chính work-management.
# Build image DB migrator (Prisma migrate deploy) từ `Dockerfile` trong repo `database`.

on:
  # Repo root (work-management) gửi repository_dispatch `build-docker-migrator` (mỗi image một event type riêng,
  # thay cho build-docker.yml chung trước đây). client_payload:
  #   { ref, version, branch, mode, encrypted_payload, run_url, source_repository? }
  # Build ở chế độ staged (push tag tạm sha-* rồi dispatch promote sang task-manager-packages).
  repository_dispatch:
    types: [build-docker-migrator]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      version:
        description: 'Version to tag the image with (fallback: root package.json → "dev")'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần build (mặc định: repo caller; task-manager-packages truyền task-manager)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Branch name — tag `latest` chỉ được push khi branch == main'
        type: string
        required: false
        default: 'main'
      staged:
        description: 'true: chỉ push tag tạm sha-* rồi dispatch task-manager-packages gắn tag chính thức'
        type: boolean
        required: false
        default: false
  # Devtool (hoặc bấm tay "Run workflow") gọi THẲNG build — bỏ vòng qua
  # dispatcher work-management. Env build truyền qua input env_json; secrets
  # (GHCR/SUBMODULE/AG_GRID/SENTRY) lấy từ chính repo task-manager-action.
  workflow_dispatch:
    inputs:
      ref:
        description: 'BẮT BUỘC — nhánh của repo thành phần cần build (vd: main, dev)'
        type: string
        required: true
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_dispatch'
      version:
        description: 'Version to tag the image with (fallback: root package.json -> "dev")'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo source cần build (mặc định phu-nam-hai-jsco/task-manager-database)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Lane build: main gan tag latest, dev -> image -dev'
        type: string
        required: false
        default: 'main'
      env_json:
        description: 'JSON build env (base64:<json> tu devtool gui kem) — hien chua tieu thu, doc khi can'
        type: string
        required: false
        default: ''
      staged:
        description: 'true: chi push tag tam sha-* roi dispatch task-manager-packages gan tag chinh thuc'
        type: boolean
        required: false
        default: false
    secrets:
      PAYLOAD_ENCRYPTION_KEY:
        description: 'Khoá giải mã payload do repo root gửi (repository_dispatch build-docker-migrator)'
        required: false

# Group theo image + nguồn build (repo/branch/ref/version/PR): các image khác nhau
# (server/web/migrator) hoặc lane khác nhau chạy SONG SONG. `github.workflow` trong
# reusable workflow là tên workflow của caller nên không dùng làm key; chỉ hủy run
# trùng hệt cùng một build.
concurrency:
  group: publish-docker-migrator-${{ inputs.source_repository || github.event.client_payload.source_repository || github.repository }}-${{ inputs.branch || github.event.client_payload.branch }}-${{ inputs.ref || github.event.client_payload.ref || github.sha }}-${{ inputs.version || github.event.client_payload.version }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  # Tham số chuẩn hoá cho cả 3 nguồn kích hoạt: workflow_call / workflow_dispatch (inputs)
  # và repository_dispatch `build-docker-migrator` (client_payload). Chỉ đọc client_payload khi đúng event
  # `build-docker-migrator` — trong workflow_call, github.event là event của caller.
  IN_REF: ${{ github.event.action == 'build-docker-migrator' && github.event.client_payload.ref || inputs.ref }}
  IN_VERSION: ${{ github.event.action == 'build-docker-migrator' && github.event.client_payload.version || inputs.version }}
  IN_BRANCH: ${{ (github.event.action == 'build-docker-migrator' && github.event.client_payload.branch || inputs.branch) || 'main' }}
  IN_SOURCE_REPOSITORY: ${{ github.event.action == 'build-docker-migrator' && (github.event.client_payload.source_repository || 'phu-nam-hai-jsco/task-manager-database') || inputs.source_repository || 'phu-nam-hai-jsco/task-manager-database' }}
  IN_STAGED: ${{ github.event.action == 'build-docker-migrator' || inputs.staged == true }}
  REGISTRY: ghcr.io
  # Ảnh publish về namespace của caller repo (GITHUB_TOKEN + packages:write đủ quyền push)
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: task-manager-migrator

permissions:
  contents: read
  packages: write

jobs:
  build-migrator:
    name: Build & Push DB Migrator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Giải mã payload do repo root gửi (PAYLOAD_ENCRYPTION_KEY chỉ có ở repo này).
      # Đọc ciphertext từ file event (không qua env/input) rồi mask ngay để không lộ trong log công khai.
      # Không có payload (vd được gọi từ task-manager-packages) thì bỏ qua và dùng secret/input như cũ.
      - name: Decrypt dispatch payload
        shell: bash
        env:
          PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PAYLOAD_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          CIPHER=$(jq -r '.client_payload.encrypted_payload // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)
          if [ -z "$CIPHER" ]; then
            echo "Không có encrypted_payload — dùng secret/input của workflow"
            exit 0
          fi
          echo "::add-mask::$CIPHER"
          if [ -z "$PAYLOAD_ENCRYPTION_KEY" ]; then
            echo "::error::Thiếu secret PAYLOAD_ENCRYPTION_KEY ở repo task-manager-action"
            exit 1
          fi
          PLAIN="$RUNNER_TEMP/payload.json"
          echo "$CIPHER" | base64 -d | openssl enc -d -aes-256-cbc -salt -pbkdf2 -pass env:PAYLOAD_ENCRYPTION_KEY -out "$PLAIN"
          jq -e 'type == "object"' "$PLAIN" > /dev/null
          for k in AG_GRID_LICENSE SENTRY_OBS_API_TOKEN MEDIATR_LICENSE_KEY; do
            v=$(jq -r --arg k "$k" '.secrets[$k] // empty' "$PLAIN")
            if [ -n "$v" ]; then
              echo "::add-mask::$v"
              echo "DECRYPTED_$k=$v" >> "$GITHUB_ENV"
            fi
          done
          echo "DECRYPTED_ENV_JSON=$(jq -c '.env_json // {}' "$PLAIN")" >> "$GITHUB_ENV"
          rm -f "$PLAIN"
          echo "✅ Đã giải mã payload từ repo root"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Chỉ checkout đúng 1 repo là database (không checkout repo chính hay docker):
      # database/Dockerfile + license-gate.sh + scripts đã tự đủ để build standalone.
      - name: Resolve source of database
        id: pins
        env:
          SRC_REPO: ${{ env.IN_SOURCE_REPOSITORY }}
          SRC_REF: ${{ env.IN_REF }}
        run: |
          set -euo pipefail
          # Build THẲNG repo thành phần theo TÊN NHÁNH do caller truyền — không theo dõi repo chính
          # (work-management) và không đọc con trỏ submodule. `ref` là BẮT BUỘC.
          if [ -z "$SRC_REF" ]; then
            echo "::error::Thiếu ref (tên nhánh cần build) — caller phải truyền ref, vd main/dev"
            exit 1
          fi
          if [[ "$SRC_REF" == -* ]] || [[ "$SRC_REF" == *".."* ]] || [[ ! "$SRC_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::ref không hợp lệ: $SRC_REF"
            exit 1
          fi
          case "$SRC_REPO" in
            */task-manager-database|*/work-management-database)
              echo "database_repo=${SRC_REPO}" >> "$GITHUB_OUTPUT"
              echo "database_sha=${SRC_REF}" >> "$GITHUB_OUTPUT"
              echo "database: ${SRC_REPO}@${SRC_REF}"
              ;;
            *)
              echo "::error::source_repository phải là repo database (phu-nam-hai-jsco/task-manager-database), nhận '${SRC_REPO}' — task-manager-action không build qua repo chính"
              exit 1
              ;;
          esac

      - name: Checkout database
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.database_repo }}
          ref: ${{ steps.pins.outputs.database_sha }}
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "$IN_VERSION" ]; then
            VERSION="$IN_VERSION"
            echo "Source: workflow input"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
            echo "Source: package.json"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Resolve lane prefix
        id: lane
        run: |
          BRANCH="$IN_BRANCH"
          if [ "$BRANCH" = "main" ]; then
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ]; then
            # Dev lane: suffix vao TEN image (task-manager-migrator-dev), tag giu sach
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "prefix=${BRANCH}-" >> $GITHUB_OUTPUT
            echo "suffix=-${BRANCH}" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GHCR không nhận token cài đặt GitHub App để ghi package của organization
          # ("installation not allowed to Write organization package") → dùng GITHUB_TOKEN
          # (permissions: packages: write). Package phải cấp quyền Write cho repo này
          # (Package settings → Manage Actions access).
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ steps.lane.outputs.name_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/task-manager-packages
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest${{ steps.lane.outputs.suffix }}
            type=raw,value=${{ steps.version.outputs.version }}${{ steps.lane.outputs.suffix }}
            type=sha,prefix=${{ steps.lane.outputs.prefix }}sha-,format=short

      - name: Resolve staging tag
        id: stage
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tag=$(echo "$TAGS" | grep -E 'sha-[0-9a-f]{7,}$' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build and push migrator image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IN_STAGED == 'true' && steps.stage.outputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer deps (bun install --frozen-lockfile) được giữ cache qua registry buildcache + gha
          # để không phải reinstall khi bun.lock không đổi.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ steps.lane.outputs.name_suffix }}:buildcache${{ steps.lane.outputs.suffix }}
            type=gha,scope=publish-migrator
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ steps.lane.outputs.name_suffix }}:buildcache${{ steps.lane.outputs.suffix }},mode=max
            type=gha,mode=max,scope=publish-migrator
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      # Chế độ staged: image mới chỉ có tag tạm sha-*; task-manager-packages gắn tag chính thức (latest, X.Y.Z).
      - name: Dispatch promote to task-manager-packages
        if: ${{ env.IN_STAGED == 'true' }}
        uses: actions/github-script@v9
        env:
          IMAGE: migrator
          DIGEST: ${{ steps.build.outputs.digest }}
          STAGE_TAG: ${{ steps.stage.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ env.IN_BRANCH }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const stageTag = process.env.STAGE_TAG;
            if (!stageTag || !process.env.DIGEST) {
              core.setFailed('Thiếu staging tag hoặc digest — không thể dispatch promote');
              return;
            }
            const repoNoTag = stageTag.substring(0, stageTag.lastIndexOf(':'));
            await github.rest.repos.createDispatchEvent({
              owner: 'phu-nam-hai-jsco',
              repo: 'task-manager-packages',
              event_type: 'promote-docker',
              client_payload: {
                image: process.env.IMAGE,
                source: `${repoNoTag}@${process.env.DIGEST}`,
                tags: process.env.TAGS.split('\n').filter(Boolean),
                version: process.env.VERSION,
                branch: process.env.BRANCH,
              },
            });
            core.notice(`Promote dispatched: ${process.env.IMAGE} ${process.env.DIGEST}`);

      - name: Summary
        run: |
          echo "## 🐳 DB Migrator Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ steps.lane.outputs.name_suffix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${IN_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
