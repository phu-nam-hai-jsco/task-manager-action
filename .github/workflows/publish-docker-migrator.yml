name: Docker Publish Migrator Build
run-name: "${{ github.workflow }} · ${{ github.sha }}"
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# Build image DB migrator (Prisma migrate deploy) từ `docker/db-migrator/Dockerfile`.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      version:
        description: 'Version to tag the image with (fallback: root package.json → "dev")'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần build (mặc định: repo caller; task-manager-packages truyền task-manager)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Branch name — tag `latest` chỉ được push khi branch == main'
        type: string
        required: false
        default: 'main'
    secrets:
      SUBMODULE_TOKEN:
        description: 'PAT with repo scope to checkout private submodules + main repo'
        required: false
      GHCR_TOKEN:
        description: 'Optional PAT with write:packages to push to GHCR (fallback: MAIN_REPO_CHECKOUT_TOKEN, then GITHUB_TOKEN)'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: 'Optional PAT fallback for checkout + GHCR login'
        required: false

# Group theo image + nguồn build (repo/branch/ref/version/PR): các image khác nhau
# (server/web/migrator) hoặc lane khác nhau chạy SONG SONG. `github.workflow` trong
# reusable workflow là tên workflow của caller nên không dùng làm key; chỉ hủy run
# trùng hệt cùng một build.
concurrency:
  group: publish-docker-migrator-${{ inputs.source_repository || github.repository }}-${{ inputs.branch }}-${{ inputs.ref || github.sha }}-${{ inputs.version }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Ảnh publish về namespace của caller repo (GITHUB_TOKEN + packages:write đủ quyền push)
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: task-manager-migrator

permissions:
  contents: read
  packages: write

jobs:
  build-migrator:
    name: Build & Push DB Migrator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}
          submodules: recursive

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Source: workflow input"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
            echo "Source: package.json"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-migrator${{ inputs.branch == 'dev' && '-dev' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/task-manager-packages
          tags: |
            type=raw,value=latest,enable=${{ inputs.branch == 'main' || inputs.branch == 'dev' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Build and push migrator image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/db-migrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ inputs.branch == 'dev' && '-dev' || '' }}:latest
            type=gha,scope=publish-migrator
          cache-to: type=gha,mode=max,scope=publish-migrator
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          echo "## 🐳 DB Migrator Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}${{ inputs.branch == 'dev' && '-dev' || '' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
