name: Test Desktop (Rust)
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# run-name: workflow gọi · repo gọi · PR/ref · trigger — nhìn là biết nguồn chạy.
run-name: >-
  Test Desktop (Rust) · ${{ (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/task-manager-frontend' && 'task-manager-frontend' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/task-manager-desktop' && 'task-manager-desktop' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/task-manager-database' && 'task-manager-database' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/task-manager-docker' && 'task-manager-docker' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/task-manager' && 'task-manager' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) }}
  · ${{ github.event.client_payload.pr_number != '' && format('PR #{0}', github.event.client_payload.pr_number)
       || github.event.client_payload.branch || inputs.branch || '' }}
  · ref ${{ github.event.client_payload.ref || inputs.ref || github.sha }}
  · ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action }}

on:
  repository_dispatch:
    types: [test-desktop]
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repo chứa source (owner/name)'
        required: true
        type: string
        default: phu-nam-hai-jsco/task-manager
      ref:
        description: 'Commit SHA cần test (bỏ trống = head của branch)'
        required: false
        type: string
      branch:
        description: 'Branch để resolve head khi bỏ trống ref'
        required: false
        type: string
        default: main
      pr_number:
        description: 'PR number (tuỳ chọn — cho báo cáo về PR)'
        required: false
        type: string
      comment_id:
        description: 'Comment id lệnh $test-* (tuỳ chọn)'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref của repo gọi cần checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Số PR cho luồng báo cáo/comment'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Id comment lệnh cho luồng $test-*'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Nhãn trigger dễ đọc'
        type: string
        required: false
        default: 'workflow_call'
      caller_run_url:
        description: 'URL run của workflow gọi (hiện ở chân báo cáo)'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần test (mặc định: repo gọi)'
        type: string
        required: false
        default: ''
      coverage_gist_id:
        description: 'Gist id để cập nhật badge coverage (chỉ chạy trên main)'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] PAT quyền repo để checkout submodule private + repo chính'
        required: false
      MAIN_REPO_PR_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] PAT tuỳ chọn (contents:write + statuses:write trên repo gọi) để đặt commit status / gửi báo cáo test-report'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] PAT dự phòng tuỳ chọn cho checkout'
        required: false
      GIST_TOKEN:
        description: 'PAT tuỳ chọn để cập nhật badge coverage (gist)'
        required: false

permissions:
  contents: read

concurrency:
  group: test-desktop-${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}-${{ github.event.client_payload.ref || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      source_repository: ${{ steps.ref.outputs.source_repository }}
      pr_number: ${{ steps.ref.outputs.pr_number }}
      comment_id: ${{ steps.ref.outputs.comment_id }}
      caller_run_url: ${{ steps.ref.outputs.caller_run_url }}
      trigger: ${{ steps.ref.outputs.trigger }}
    steps:
      # Nhận từ repository_dispatch (client_payload), workflow_dispatch hoặc workflow_call (inputs).
      # Token ngắn hạn từ GitHub App, chỉ cần quyền đọc để resolve head của branch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Resolve
        id: ref
        uses: actions/github-script@v9
        env:
          SOURCE: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
          REF_IN: ${{ github.event.client_payload.ref || inputs.ref || '' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number || '' }}
          COMMENT_ID: ${{ github.event.client_payload.comment_id || inputs.comment_id || '' }}
          CALLER_RUN_URL: ${{ github.event.client_payload.caller_run_url || inputs.caller_run_url || '' }}
          TRIGGER: ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action || 'manual' }}
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            const [sOwner, sRepo] = process.env.SOURCE.split('/');
            let ref = process.env.REF_IN;
            if (!ref) {
              const b = await github.rest.repos.getBranch({
                owner: sOwner, repo: sRepo, branch: process.env.BRANCH,
              });
              ref = b.data.commit.sha;
              core.info(`Resolved ${process.env.BRANCH} head: ${ref}`);
            }
            core.setOutput('ref', ref);
            core.setOutput('source_repository', process.env.SOURCE);
            core.setOutput('pr_number', process.env.PR_NUMBER);
            core.setOutput('comment_id', process.env.COMMENT_ID);
            core.setOutput('caller_run_url', process.env.CALLER_RUN_URL);
            core.setOutput('trigger', process.env.TRIGGER);

  test:
    name: Run Tests
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HAS_GIST_TOKEN: ${{ secrets.GIST_TOKEN != '' }}
      # Coverage chỉ cần khi có PR để comment, hoặc khi chạy trên main để cập nhật badge
      WITH_COVERAGE: ${{ needs.resolve.outputs.pr_number != '' || needs.resolve.outputs.ref == 'main' }}
      # Caller repo context (reusable workflow chạy với context của caller)
      MAIN_REPO: ${{ needs.resolve.outputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Test
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      # Token ngắn hạn từ GitHub App (giống claude.yml), thay cho PAT.
      # - read-token: đọc repo nguồn + submodule (contents: read).
      # - report-token: chỉ repo nguồn; đặt commit status và gửi repository_dispatch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: write
          permission-statuses: write
      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Run Tests in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo caller repo đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && needs.resolve.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'desktop-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      - name: Checkout Frontend Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-frontend
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-frontend' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: frontend

      # Mirror azure.archive.ubuntu.com đôi khi cực chậm (run 39920827675: ~35 MB mất >10 phút → treo
      # hết 45 phút). Retry + timeout mỗi kết nối để lỗi mạng lẻ tẻ không kéo cả job.
      - name: Configure apt (retries / timeouts)
        run: |
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      # Cache các gói .deb (~180 MB, ~850 MB sau cài) theo danh sách gói: lần sau khỏi tải lại từ mirror.
      # timeout riêng → nếu mirror kẹt thì fail sau 15 phút thay vì 45.
      # Cache key = hash(gói) + version. Cache cũ tauri-desktop-v1 bị lưu rỗng (~0 MB, 6 KB) nên cache hit
      # mà không cài gói nào → build glib-sys fail "glib-2.0 not found" (run 40804883075). Bump version để bỏ cache hỏng.
      - name: Install system dependencies (Linux / Tauri)
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev
            gcc-mingw-w64-x86-64
          version: tauri-desktop-v2
          # Cần chạy postinst: gcc-mingw-w64 tạo symlink x86_64-w64-mingw32-gcc qua update-alternatives
          # (windres cần gcc này khi build target windows-gnu); mặc định action bỏ qua nên thiếu gcc.
          execute_install_scripts: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect layout
        run: |
          # Desktop repo duoc checkout tai path desktop/ (siblings: desktop/ + frontend/)
          echo "DESKTOP_ROOT=desktop" >> "$GITHUB_ENV"
          # tauri.conf frontendDist ../frontend/dist (tu desktop/) = workspace/frontend/dist
          echo "FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist" >> "$GITHUB_ENV"

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (desktop)
        id: install
        working-directory: ${{ env.DESKTOP_ROOT }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend static export
        id: build_ui
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          NEXT_TAURI_STATIC_EXPORT: '1'
        run: |
          # tauri-next-static.ts chay `next build` trong ../frontend (sibling)
          # voi NEXT_TAURI_STATIC_EXPORT=1 -> static export vao ../frontend/dist
          # = dung path frontendDist cua tauri.conf -> generate_context thay that.
          bun scripts/tauri-next-static.ts
          test -f ../frontend/dist/index.html && echo "FE static export OK"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          # Target Windows 64-bit (mingw-w64) để biên dịch code cfg(windows) ngay trên Linux.
          targets: x86_64-pc-windows-gnu

      - name: Install cargo-llvm-cov
        if: env.WITH_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.DESKTOP_ROOT }}/artifacts/target
            ${{ env.DESKTOP_ROOT }}/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(format('{0}/Cargo.lock', env.DESKTOP_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        id: tests
        if: env.WITH_COVERAGE != 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: cargo test --all-features

      - name: Run tests with coverage
        id: tests_cov
        if: env.WITH_COVERAGE == 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --cobertura --output-path coverage/desktop-coverage.xml

      # Desktop phát hành trên Windows nhưng runner là Linux: biên dịch + link bộ test cho target
      # Windows 64-bit (mingw-w64) để bắt lỗi ở code cfg(windows) (vd. windows-native-keyring-store,
      # webview2-com/windows-core). Chỉ build, không chạy (--no-run): file .exe cần Windows để chạy.
      - name: Build tests for Windows target (x86_64-pc-windows-gnu)
        id: tests_win
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: cargo test --target x86_64-pc-windows-gnu --all-features --no-run

      - name: Code Coverage Summary
        if: env.WITH_COVERAGE == 'true'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '50 75'

      - name: Extract coverage percentage
        id: coverage
        if: env.WITH_COVERAGE == 'true'
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' "$DESKTOP_ROOT/coverage/desktop-coverage.xml" | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc | xargs printf "%.1f")
          echo "percentage=${COVERAGE_PCT}" >> $GITHUB_OUTPUT
          echo "Desktop Coverage: ${COVERAGE_PCT}%"

      - name: Update coverage badge (Gist)
        if: needs.resolve.outputs.ref == 'main' && inputs.coverage_gist_id != '' && env.HAS_GIST_TOKEN == 'true'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ inputs.coverage_gist_id }}
          filename: desktop-coverage.json
          label: Desktop coverage
          message: '${{ steps.coverage.outputs.percentage }}%'
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

      - name: Upload coverage reports
        if: always() && env.WITH_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-reports
          path: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build PR report
        if: always() && env.PR_NUMBER != ''
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ needs.resolve.outputs.trigger }}
          CALLER_RUN_URL: ${{ needs.resolve.outputs.caller_run_url }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD_UI: ${{ steps.build_ui.outcome }}
          TESTS: ${{ steps.tests_cov.outcome }}
          TESTS_WIN: ${{ steps.tests_win.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$JOB_STATUS" = "success" ] && RESULT="✅ Passed" || RESULT="❌ $JOB_STATUS"
          {
            echo "## 🧪 Desktop Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install dependencies | $(icon "$INSTALL") |"
            echo "| Build Tauri UI | $(icon "$BUILD_UI") |"
            echo "| Cargo test (llvm-cov) | $(icon "$TESTS") |"
            echo "| Build tests (Windows x64) | $(icon "$TESTS_WIN") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Desktop Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [workflow run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md

      - name: Set final status on caller repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về caller repo qua createDispatchEvent 'test-report'; workflow test-report.yml
      # ở caller repo đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN
      # (github-actions[bot]).
      - name: Send report to caller repo
        if: always() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
          CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 desktop-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // Dispatch event giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'desktop-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/${owner}/${repo}/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">${owner}/${repo}#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading(`🧪 Test report → ${repo}`, 3).addTable(rows).write();
            core.info(`Report sent to ${owner}/${repo} (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);
