name: Test Desktop (Rust)
# Reusable workflow — được caller (phu-nam-hai-jsco/work-management) gọi qua `uses:`.
# run-name: workflow gọi · repo gọi · PR/ref · trigger — nhìn là biết nguồn chạy.
run-name: >-
  Test Desktop (Rust) · ${{ (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/work-management' && 'work-management' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/work-management-frontend' && 'work-management-frontend' || 'task-manager-desktop' }}
  · ${{ github.event.client_payload.pr_number != '' && format('PR #{0}', github.event.client_payload.pr_number)
       || github.event.client_payload.branch || inputs.branch || '' }}
  · ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action }}

on:
  repository_dispatch:
    types: [test-desktop]
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repo chứa source (owner/name)'
        required: true
        type: string
        default: phu-nam-hai-jsco/work-management
      ref:
        description: 'Commit SHA cần test (bỏ trống = head của branch)'
        required: false
        type: string
      branch:
        description: 'Branch để resolve head khi bỏ trống ref'
        required: false
        type: string
        default: main
      pr_number:
        description: 'PR number (tuỳ chọn — cho báo cáo về PR)'
        required: false
        type: string
      comment_id:
        description: 'Comment id lệnh $test-* (tuỳ chọn)'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref của repo gọi cần checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Số PR cho luồng báo cáo/comment'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Id comment lệnh cho luồng $test-*'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Nhãn trigger dễ đọc'
        type: string
        required: false
        default: 'workflow_call'
      caller_run_url:
        description: 'URL run của workflow gọi (hiện ở chân báo cáo)'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần test (mặc định: repo gọi)'
        type: string
        required: false
        default: ''
      coverage_gist_id:
        description: '[Không còn dùng — badge do update-coverage-badge.yml cập nhật, lấy Gist id từ biến repo COVERAGE_GIST_ID]'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: test-desktop-${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}-${{ github.event.client_payload.ref || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      source_repository: ${{ steps.ref.outputs.source_repository }}
      pr_number: ${{ steps.ref.outputs.pr_number }}
      comment_id: ${{ steps.ref.outputs.comment_id }}
      caller_run_url: ${{ steps.ref.outputs.caller_run_url }}
      trigger: ${{ steps.ref.outputs.trigger }}
      is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      # Nhận từ repository_dispatch (client_payload), workflow_dispatch hoặc workflow_call (inputs).
      # Token ngắn hạn từ GitHub App, chỉ cần quyền đọc để resolve head của branch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Resolve
        id: ref
        uses: actions/github-script@v9
        env:
          SOURCE: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
          REF_IN: ${{ github.event.client_payload.ref || inputs.ref || '' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number || '' }}
          COMMENT_ID: ${{ github.event.client_payload.comment_id || inputs.comment_id || '' }}
          CALLER_RUN_URL: ${{ github.event.client_payload.caller_run_url || inputs.caller_run_url || '' }}
          TRIGGER: ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action || 'manual' }}
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            const [sOwner, sRepo] = process.env.SOURCE.split('/');
            let ref = process.env.REF_IN;
            if (!ref) {
              const b = await github.rest.repos.getBranch({
                owner: sOwner, repo: sRepo, branch: process.env.BRANCH,
              });
              ref = b.data.commit.sha;
              core.info(`Resolved ${process.env.BRANCH} head: ${ref}`);
            }
            // Caller có thể truyền tên branch/tag thay vì SHA → đổi sang SHA để so sánh và đặt commit status
            if (!/^[0-9a-f]{40}$/i.test(ref)) {
              try {
                const c = await github.rest.repos.getCommit({ owner: sOwner, repo: sRepo, ref });
                core.info(`Resolved ${ref} -> ${c.data.sha}`);
                ref = c.data.sha;
              } catch (e) {
                core.warning(`Không resolve được ref '${ref}' thành SHA: ${e.message}`);
              }
            }
            // Đang test head của main? (ref luôn là SHA nên không so sánh được với chuỗi 'main')
            let isMain = false;
            try {
              const m = await github.rest.repos.getBranch({ owner: sOwner, repo: sRepo, branch: 'main' });
              isMain = m.data.commit.sha === ref;
            } catch (e) {
              core.warning(`Không lấy được head của main: ${e.message}`);
            }
            core.setOutput('ref', ref);
            core.setOutput('is_main', String(isMain));
            core.setOutput('source_repository', process.env.SOURCE);
            core.setOutput('pr_number', process.env.PR_NUMBER);
            core.setOutput('comment_id', process.env.COMMENT_ID);
            core.setOutput('caller_run_url', process.env.CALLER_RUN_URL);
            core.setOutput('trigger', process.env.TRIGGER);

  test:
    name: Run Tests
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Coverage chỉ cần khi có PR để comment, hoặc khi chạy trên main để cập nhật badge
      WITH_COVERAGE: ${{ needs.resolve.outputs.pr_number != '' || needs.resolve.outputs.is_main == 'true' }}
      # Caller repo context (reusable workflow chạy với context của caller)
      MAIN_REPO: ${{ needs.resolve.outputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Test
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      # Token ngắn hạn từ GitHub App (giống claude.yml), thay cho PAT.
      # - read-token: đọc repo nguồn + submodule (contents: read).
      # - report-token: chỉ repo nguồn; đặt commit status và gửi repository_dispatch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: write
          permission-statuses: write
      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Run Tests in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo caller repo đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && needs.resolve.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'desktop-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      # Desktop repo được checkout tại desktop/ (sibling với frontend/ khi cần).
      # Chỉ cần build static export của frontend khi tauri.conf `build.frontendDist` trỏ vào
      # ../frontend (kiến trúc cũ). Kiến trúc sidecar (bun + Next standalone) đặt frontendDist
      # = ./empty-frontend → generate_context!() không cần frontend → bỏ checkout/install/build.
      - name: Detect layout
        id: layout
        run: |
          echo "DESKTOP_ROOT=desktop" >> "$GITHUB_ENV"
          DIST=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("desktop/tauri.conf.json","utf8")).build?.frontendDist ?? "")')
          echo "tauri.conf frontendDist: ${DIST:-<trống>}"
          case "$DIST" in
            ../frontend*)
              echo "needs_frontend=true" >> "$GITHUB_OUTPUT"
              echo "FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist" >> "$GITHUB_ENV" ;;
            *)
              echo "needs_frontend=false" >> "$GITHUB_OUTPUT"
              echo "Frontend phục vụ qua sidecar — bỏ qua checkout/build frontend." ;;
          esac

      - name: Checkout Frontend Repository
        if: steps.layout.outputs.needs_frontend == 'true'
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/work-management-frontend
          ref: ${{ (contains(fromJSON('["phu-nam-hai-jsco/work-management-frontend","phu-nam-hai-jsco/task-manager-frontend"]'), needs.resolve.outputs.source_repository) && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Cache Bun & Next.js build
        if: steps.layout.outputs.needs_frontend == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            frontend/.next/cache
          key: ${{ runner.os }}-bun-nextjs-${{ hashFiles('frontend/bun.lock', 'desktop/bun.lock', 'frontend/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-bun-nextjs-

      - name: Install dependencies (frontend)
        if: steps.layout.outputs.needs_frontend == 'true'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install dependencies (desktop)
        id: install
        working-directory: ${{ env.DESKTOP_ROOT }}
        run: bun install --frozen-lockfile

      - name: Build frontend static export
        id: build_ui
        if: steps.layout.outputs.needs_frontend == 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          NEXT_TAURI_STATIC_EXPORT: '1'
        run: |
          # tauri-next-static.ts chay `next build` trong ../frontend (sibling)
          # voi NEXT_TAURI_STATIC_EXPORT=1 -> static export vao ../frontend/dist
          # = dung path frontendDist cua tauri.conf -> generate_context thay that.
          bun scripts/tauri-next-static.ts
          test -f ../frontend/dist/index.html && echo "FE static export OK"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: env.WITH_COVERAGE == 'true'
        uses: taiki-e/install-action@c2e5d2ce8920c881761c4cabb41434daa1f95687 # cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.DESKTOP_ROOT }}/artifacts/target
            ${{ env.DESKTOP_ROOT }}/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(format('{0}/Cargo.lock', env.DESKTOP_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        id: tests
        if: env.WITH_COVERAGE != 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: cargo test --workspace --all-features

      - name: Run tests with coverage
        id: tests_cov
        if: env.WITH_COVERAGE == 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
          # Target-dir tuyệt đối, một kiểu dấu phân cách (desktop repo đặt `artifacts/target` tương đối).
          CARGO_TARGET_DIR: ${{ github.workspace }}\${{ env.DESKTOP_ROOT }}\target
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --no-report
          if cargo llvm-cov report --cobertura --output-path coverage/desktop-coverage.xml; then
            exit 0
          fi

          # Fallback: trên Windows `cargo llvm-cov report` có thể lỗi "no coverage data found" vì
          # một object không có coverage mapping (vd cdylib của Tauri) làm llvm-cov từ chối CẢ bộ.
          # Thử từng object của các package trong workspace, bỏ object lỗi rồi tự export.
          echo "::warning::cargo llvm-cov report lỗi — thử export từng object (fallback)"
          # Tool là .exe native: truyền đường dẫn dạng `D:/...` (cygpath -m), không dựa vào MSYS tự đổi.
          TARGET="$(cygpath -u "$CARGO_TARGET_DIR")/llvm-cov-target"
          TOOLS="$(cygpath -u "$(rustc --print sysroot)")/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          PROFDATA="$(cygpath -m "$TARGET")/fallback.profdata"
          mapfile -t PROFRAWS < <(find "$TARGET" -maxdepth 1 -name '*.profraw' -exec cygpath -m {} \;)
          echo "${#PROFRAWS[@]} profraw file"
          "$TOOLS/llvm-profdata" merge -sparse "${PROFRAWS[@]}" -o "$PROFDATA"

          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).packages.map(p=>p.name).join(" ")))')
          OBJECTS=()
          for pkg in $PKGS; do
            while IFS= read -r obj; do
              obj="$(cygpath -m "$obj")"
              case "$(basename "$obj")" in build_script_*|build-script-*) continue ;; esac
              if err=$("$TOOLS/llvm-cov" export -summary-only -instr-profile="$PROFDATA" "$obj" 2>&1 >/dev/null); then
                echo "✓ $obj"; OBJECTS+=("$obj")
              else
                echo "✗ bỏ qua $obj: $err"
              fi
            done < <(find "$TARGET/debug" -path "*/build/$pkg/*/out/*" \( -name '*.exe' -o -name '*.dll' \) 2>/dev/null)
          done
          [ ${#OBJECTS[@]} -gt 0 ] || { echo "::error::Không object nào có coverage data"; exit 1; }

          ARGS=("${OBJECTS[0]}")
          for o in "${OBJECTS[@]:1}"; do ARGS+=(-object "$o"); done
          "$TOOLS/llvm-cov" export -format=lcov -instr-profile="$PROFDATA" "${ARGS[@]}" \
            -ignore-filename-regex='([\\/](\.cargo|\.rustup|rustc)[\\/])|llvm-cov-target|[\\/]tests[\\/]' \
            > coverage/desktop.lcov

          # LCOV → Cobertura (chỉ phần bước summary bên dưới cần: tổng + <class filename> + <line>).
          node -e '
            const fs = require("fs");
            const files = new Map(); let cur = null;
            for (const l of fs.readFileSync("coverage/desktop.lcov", "utf8").split(/\r?\n/)) {
              if (l.startsWith("SF:")) { cur = files.get(l.slice(3)) || new Map(); files.set(l.slice(3), cur); }
              else if (l.startsWith("DA:") && cur) {
                const [n, h] = l.slice(3).split(",").map(Number);
                cur.set(n, Math.max(cur.get(n) || 0, h));
              }
            }
            let covered = 0, valid = 0; const classes = [];
            const esc = (s) => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
            for (const [f, lines] of files) {
              const rows = [...lines].sort((a, b) => a[0] - b[0]);
              valid += rows.length; covered += rows.filter(([, h]) => h > 0).length;
              classes.push(`<class name="${esc(f)}" filename="${esc(f)}"><lines>` +
                rows.map(([n, h]) => `<line number="${n}" hits="${h}"/>`).join("") + "</lines></class>");
            }
            const rate = valid ? covered / valid : 0;
            fs.writeFileSync("coverage/desktop-coverage.xml",
              `<?xml version="1.0"?>\n<coverage line-rate="${rate}" branch-rate="0" lines-covered="${covered}" lines-valid="${valid}" branches-covered="0" branches-valid="0">` +
              `<packages><package name="desktop"><classes>${classes.join("")}</classes></package></packages></coverage>\n`);
            console.log(`Fallback coverage: ${(rate * 100).toFixed(1)}% (${covered}/${valid}, ${files.size} file)`);
          '

      # Dùng Node đọc Cobertura XML thay cho irongut/CodeCoverageSummary (Docker action chỉ chạy trên Linux).
      - name: Code Coverage Summary & Extract percentage
        id: coverage
        if: env.WITH_COVERAGE == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync(process.env.DESKTOP_ROOT + "/coverage/desktop-coverage.xml", "utf8");
            const attr = (k) => (xml.match(new RegExp(k + "=\"([^\"]+)\"")) || [])[1];
            const lr = (Number(attr("line-rate") || 0) * 100).toFixed(1);
            const lc = attr("lines-covered") || "0";
            const lv = attr("lines-valid") || "0";
            const br = (Number(attr("branch-rate") || 0) * 100).toFixed(1);
            const bc = attr("branches-covered") || "0";
            const bv = attr("branches-valid") || "0";
            const icon = (pct) => (pct >= 75 ? "🟢" : pct >= 50 ? "🟡" : "🔴");
            const badge = icon(Number(lr));

            // Gom số dòng theo file (một file có thể nằm ở nhiều <class>): line -> hits lớn nhất.
            const files = new Map();
            const classRe = /<class\b[^>]*\bfilename="([^"]+)"[^>]*>([\s\S]*?)<\/class>/g;
            const lineRe = /<line\b[^>]*\bnumber="(\d+)"[^>]*\bhits="(\d+)"/g;
            const rel = (f) => {
              const n = f.replace(/\\/g, "/");
              const m = n.match(/(?:^|\/)((?:src|packages)\/.*)$/);
              return m ? m[1] : n;
            };
            for (const [, filename, body] of xml.matchAll(classRe)) {
              const key = rel(filename);
              const lines = files.get(key) || new Map();
              for (const [, num, hits] of body.matchAll(lineRe)) {
                lines.set(num, Math.max(lines.get(num) || 0, Number(hits)));
              }
              files.set(key, lines);
            }

            // Nhóm theo module: src/<module>, packages/<tên>/src/<module>; file nằm thẳng
            // trong src gộp vào "src" / "packages/<tên>/src".
            const groupOf = (f) => {
              const parts = f.split("/");
              if (parts[0] === "packages" && parts[2] === "src" && parts.length > 4) return parts.slice(0, 4).join("/");
              if (parts[0] === "packages" && parts.length > 2) return parts.slice(0, Math.min(3, parts.length - 1)).join("/");
              if (parts[0] === "src" && parts.length > 2) return parts.slice(0, 2).join("/");
              return parts[0] === "src" ? "src" : parts.slice(0, -1).join("/") || f;
            };
            const stat = (lines) => {
              let covered = 0;
              for (const h of lines.values()) if (h > 0) covered++;
              return { covered, total: lines.size };
            };
            const groups = new Map();
            const fileRows = [];
            for (const [f, lines] of [...files.entries()].sort(([a], [b]) => a.localeCompare(b))) {
              const s = stat(lines);
              if (!s.total) continue;
              fileRows.push([f, s]);
              const g = groups.get(groupOf(f)) || { covered: 0, total: 0, files: 0 };
              g.covered += s.covered; g.total += s.total; g.files++;
              groups.set(groupOf(f), g);
            }
            const pct = (s) => (s.total ? (s.covered / s.total) * 100 : 0);
            const row = (name, s, extra = "") =>
              `| \`${name}\` | ${icon(pct(s))} ${pct(s).toFixed(1)}% | ${s.covered} / ${s.total} |${extra}`;

            const md = [
              "### Desktop Coverage",
              "",
              "| Metric | Coverage | Covered / Total |",
              "|--------|----------|-----------------|",
              `| Line | ${badge} ${lr}% | ${lc} / ${lv} |`,
              `| Branch | ${br}% | ${bc} / ${bv} |`,
              "",
              "#### Theo khu vực (src / packages)",
              "",
              "| Khu vực | Line | Covered / Total | Files |",
              "|---------|------|-----------------|-------|",
              ...[...groups.entries()]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([name, s]) => row(name, s, ` ${s.files} |`)),
              "",
              "<details><summary>Chi tiết theo file</summary>",
              "",
              "| File | Line | Covered / Total |",
              "|------|------|-----------------|",
              ...fileRows.map(([f, s]) => row(f, s)),
              "",
              "</details>",
            ].join("\n") + "\n";
            fs.writeFileSync("code-coverage-results.md", md);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `percentage=${lr}\n`);
            console.log(`Desktop Coverage: ${lr}% (${groups.size} khu vực, ${fileRows.length} file)`);
          '

      # Badge Gist được cập nhật ở workflow riêng (update-coverage-badge.yml): ở đây chỉ lưu số liệu
      # khi test head của main thành công, workflow kia tải artifact này rồi ghi lên Gist.
      - name: Save coverage badge data
        if: needs.resolve.outputs.is_main == 'true'
        env:
          PERCENTAGE: ${{ steps.coverage.outputs.percentage }}
        run: |
          mkdir -p badge
          jq -n --arg filename 'desktop-coverage.json' --arg label 'Desktop coverage' --arg percentage "$PERCENTAGE" \
            '{filename: $filename, label: $label, percentage: $percentage}' > badge/badge.json

      - name: Upload coverage badge data
        if: needs.resolve.outputs.is_main == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: badge/badge.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage reports
        if: always() && env.WITH_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-reports
          path: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build PR report
        if: always() && env.PR_NUMBER != ''
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ needs.resolve.outputs.trigger }}
          CALLER_RUN_URL: ${{ needs.resolve.outputs.caller_run_url }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD_UI: ${{ steps.build_ui.outcome }}
          NEEDS_FRONTEND: ${{ steps.layout.outputs.needs_frontend }}
          TESTS: ${{ steps.tests_cov.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$JOB_STATUS" = "success" ] && RESULT="✅ Passed" || RESULT="❌ $JOB_STATUS"
          {
            echo "## 🧪 Desktop Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install dependencies | $(icon "$INSTALL") |"
            if [ "$NEEDS_FRONTEND" = "false" ]; then
              echo "| Build Tauri UI | ⏭️ Không cần (frontend chạy qua sidecar) |"
            else
              echo "| Build Tauri UI | $(icon "$BUILD_UI") |"
            fi
            echo "| Cargo test (llvm-cov) | $(icon "$TESTS") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Desktop Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [workflow run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md

      - name: Set final status on caller repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về caller repo qua createDispatchEvent 'test-report'; workflow test-report.yml
      # ở caller repo đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN
      # (github-actions[bot]).
      - name: Send report to caller repo
        if: always() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
          CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 desktop-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // Dispatch event giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'desktop-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/${owner}/${repo}/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">${owner}/${repo}#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading(`🧪 Test report → ${repo}`, 3).addTable(rows).write();
            core.info(`Report sent to ${owner}/${repo} (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);
