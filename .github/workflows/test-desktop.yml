name: Test Desktop (Rust)
# Reusable workflow — được caller (phu-nam-hai-jsco/work-management) gọi qua `uses:`.
# run-name: workflow gọi · repo gọi · PR/ref · trigger — nhìn là biết nguồn chạy.
run-name: >-
  Test Desktop (Rust) · ${{ (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/work-management' && 'work-management' || (github.event.client_payload.source_repository || inputs.source_repository || github.repository) == 'phu-nam-hai-jsco/work-management-frontend' && 'work-management-frontend' || 'task-manager-desktop' }}
  · ${{ github.event.client_payload.pr_number != '' && format('PR #{0}', github.event.client_payload.pr_number)
       || github.event.client_payload.branch || inputs.branch || '' }}
  · ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action }}

on:
  repository_dispatch:
    types: [test-desktop]
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repo chứa source (owner/name)'
        required: true
        type: string
        default: phu-nam-hai-jsco/work-management
      ref:
        description: 'Commit SHA cần test (bỏ trống = head của branch)'
        required: false
        type: string
      branch:
        description: 'Branch để resolve head khi bỏ trống ref'
        required: false
        type: string
        default: main
      pr_number:
        description: 'PR number (tuỳ chọn — cho báo cáo về PR)'
        required: false
        type: string
      comment_id:
        description: 'Comment id lệnh $test-* (tuỳ chọn)'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref của repo gọi cần checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'Số PR cho luồng báo cáo/comment'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Id comment lệnh cho luồng $test-*'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Nhãn trigger dễ đọc'
        type: string
        required: false
        default: 'workflow_call'
      caller_run_url:
        description: 'URL run của workflow gọi (hiện ở chân báo cáo)'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần test (mặc định: repo gọi)'
        type: string
        required: false
        default: ''
      coverage_gist_id:
        description: '[Không còn dùng — badge do update-coverage-badge.yml cập nhật, lấy Gist id từ biến repo COVERAGE_GIST_ID]'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: test-desktop-${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}-${{ github.event.client_payload.ref || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source ref
    runs-on: [self-hosted, Linux, X64]
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      source_repository: ${{ steps.ref.outputs.source_repository }}
      pr_number: ${{ steps.ref.outputs.pr_number }}
      comment_id: ${{ steps.ref.outputs.comment_id }}
      caller_run_url: ${{ steps.ref.outputs.caller_run_url }}
      trigger: ${{ steps.ref.outputs.trigger }}
      is_main: ${{ steps.ref.outputs.is_main }}
    steps:
      # Nhận từ repository_dispatch (client_payload), workflow_dispatch hoặc workflow_call (inputs).
      # Token ngắn hạn từ GitHub App, chỉ cần quyền đọc để resolve head của branch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Resolve
        id: ref
        uses: actions/github-script@v9
        env:
          SOURCE: ${{ github.event.client_payload.source_repository || inputs.source_repository || github.repository }}
          REF_IN: ${{ github.event.client_payload.ref || inputs.ref || '' }}
          BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number || '' }}
          COMMENT_ID: ${{ github.event.client_payload.comment_id || inputs.comment_id || '' }}
          CALLER_RUN_URL: ${{ github.event.client_payload.caller_run_url || inputs.caller_run_url || '' }}
          TRIGGER: ${{ github.event.client_payload.trigger || inputs.trigger || github.event.action || 'manual' }}
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            const [sOwner, sRepo] = process.env.SOURCE.split('/');
            let ref = process.env.REF_IN;
            if (!ref) {
              const b = await github.rest.repos.getBranch({
                owner: sOwner, repo: sRepo, branch: process.env.BRANCH,
              });
              ref = b.data.commit.sha;
              core.info(`Resolved ${process.env.BRANCH} head: ${ref}`);
            }
            // Caller có thể truyền tên branch/tag thay vì SHA → đổi sang SHA để so sánh và đặt commit status
            if (!/^[0-9a-f]{40}$/i.test(ref)) {
              try {
                const c = await github.rest.repos.getCommit({ owner: sOwner, repo: sRepo, ref });
                core.info(`Resolved ${ref} -> ${c.data.sha}`);
                ref = c.data.sha;
              } catch (e) {
                core.warning(`Không resolve được ref '${ref}' thành SHA: ${e.message}`);
              }
            }
            // Đang test head của main? (ref luôn là SHA nên không so sánh được với chuỗi 'main')
            let isMain = false;
            try {
              const m = await github.rest.repos.getBranch({ owner: sOwner, repo: sRepo, branch: 'main' });
              isMain = m.data.commit.sha === ref;
            } catch (e) {
              core.warning(`Không lấy được head của main: ${e.message}`);
            }
            core.setOutput('ref', ref);
            core.setOutput('is_main', String(isMain));
            core.setOutput('source_repository', process.env.SOURCE);
            core.setOutput('pr_number', process.env.PR_NUMBER);
            core.setOutput('comment_id', process.env.COMMENT_ID);
            core.setOutput('caller_run_url', process.env.CALLER_RUN_URL);
            core.setOutput('trigger', process.env.TRIGGER);

  test:
    name: Run Tests (Windows)
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Caller repo context (reusable workflow chạy với context của caller)
      MAIN_REPO: ${{ needs.resolve.outputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Test
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      # Token ngắn hạn từ GitHub App (giống claude.yml), thay cho PAT.
      # - read-token: đọc repo nguồn + submodule (contents: read).
      # - report-token: chỉ repo nguồn; đặt commit status và gửi repository_dispatch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: write
          permission-statuses: write
      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Run Tests in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo caller repo đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && needs.resolve.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'desktop-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      # Kiến trúc mới: frontend được đóng gói thành `work-management-frontend.exe` (next-bun-compile)
      # chỉ ở bước bundle; tauri.conf `build.frontendDist` = ./empty-frontend nên `cargo test`
      # (generate_context!) không cần checkout/build frontend nữa.
      - name: Detect layout
        run: |
          echo "DESKTOP_ROOT=desktop" >> "$GITHUB_ENV"
          DIST=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("desktop/tauri.conf.json","utf8")).build?.frontendDist ?? "")')
          echo "tauri.conf frontendDist: ${DIST:-<trống>}"
          if [ -z "$DIST" ] || [ ! -e "desktop/$DIST" ]; then
            echo "::error::frontendDist '$DIST' không tồn tại trong desktop repo — CI không còn build static export của frontend (dùng ./empty-frontend)."
            exit 1
          fi

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-desktop-${{ hashFiles('desktop/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-desktop-

      - name: Install dependencies (desktop)
        id: install
        working-directory: ${{ env.DESKTOP_ROOT }}
        run: bun install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.DESKTOP_ROOT }}/artifacts/target
            ${{ env.DESKTOP_ROOT }}/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(format('{0}/Cargo.lock', env.DESKTOP_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        id: tests
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: cargo test --workspace --all-features

  # Coverage chạy trên Linux: trên Windows/MSVC (rustc 1.100) llvm-cov không đọc được coverage
  # mapping của binary ("no coverage data found" ở mọi object dù test pass và có .profraw).
  # Job `test` (Windows) vẫn chạy cargo test để bắt lỗi code cfg(windows).
  # Chạy cho MỌI nguồn kích hoạt (PR, push mọi nhánh, chạy tay) để luôn có báo cáo coverage
  # trong Job Summary; comment PR chỉ khi có PR, badge chỉ cập nhật trên main.
  coverage:
    name: Coverage (Linux)
    needs: resolve
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      DESKTOP_ROOT: desktop
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Resolve source repository
        id: source
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi
          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      - name: Install system dependencies (Tauri / Linux)
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libsoup-3.0-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      # Script dựng báo cáo coverage dùng chung (desktop / web / .NET). Chạy trong repo này thì lấy
      # đúng commit đang chạy; được repo khác gọi (workflow_call) thì lấy từ main.
      - name: Checkout coverage report script
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-action
          ref: ${{ github.repository == 'phu-nam-hai-jsco/task-manager-action' && github.sha || 'main' }}
          path: .ci-scripts
          sparse-checkout: .github/scripts
          fetch-depth: 1

      # Branch coverage (`--branch` = -Z coverage-options=branch) chỉ có trên nightly.
      - name: Setup Rust toolchain (nightly, cho branch coverage)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@41e135bca37b18b5a9cc134855b5b3bccbedbf26 # cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/artifacts/target
          key: ${{ runner.os }}-cargo-cov-nightly-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-nightly-

      - name: Run tests with coverage
        id: tests_cov
        working-directory: ${{ env.DESKTOP_ROOT }}
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --all-features --branch --cobertura --output-path coverage/desktop-coverage.xml

      - name: Code Coverage Summary & Extract percentage
        id: coverage
        env:
          COVERAGE_XML: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          REPORT_TITLE: Desktop Coverage
          # src/<module>, packages/<tên>/src/<module>
          GROUP_DEPTH: '4'
        run: bun .ci-scripts/.github/scripts/coverage-summary.ts

      # Badge Gist được cập nhật ở workflow riêng (update-coverage-badge.yml): ở đây chỉ lưu số liệu
      # khi test head của main thành công, workflow kia tải artifact này rồi ghi lên Gist.
      - name: Save coverage badge data
        if: needs.resolve.outputs.is_main == 'true'
        env:
          PERCENTAGE: ${{ steps.coverage.outputs.percentage }}
        run: |
          mkdir -p badge
          jq -n --arg filename 'desktop-coverage.json' --arg label 'Desktop coverage' --arg percentage "$PERCENTAGE" \
            '{filename: $filename, label: $label, percentage: $percentage}' > badge/badge.json

      - name: Upload coverage badge data
        if: needs.resolve.outputs.is_main == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: badge/badge.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-reports
          path: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage summary (for report job)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-summary
          path: code-coverage-results.md
          retention-days: 1
          if-no-files-found: ignore

  # Gộp kết quả test (Windows) + coverage (Linux) + build app → commit status "Desktop Test"
  # và một comment báo cáo trên PR của repo gọi.
  report:
    name: Report
    needs: [resolve, test, coverage, build]
    if: always() && needs.resolve.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MAIN_REPO: ${{ needs.resolve.outputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Test
      TEST_RESULT: ${{ needs.test.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      # Test (Windows) phải xanh; coverage được phép skipped (không có PR / không phải main).
      CONCLUSION: ${{ (needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.coverage.result)) && 'success' || 'failure' }}
    steps:
      - name: Resolve source repository
        id: source
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi
          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: write
          permission-statuses: write

      - name: Download coverage summary
        if: needs.coverage.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: desktop-coverage-summary

      - name: Build PR report
        if: env.PR_NUMBER != ''
        env:
          TRIGGER: ${{ needs.resolve.outputs.trigger }}
          CALLER_RUN_URL: ${{ needs.resolve.outputs.caller_run_url }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$CONCLUSION" = "success" ] && RESULT="✅ Passed" || RESULT="❌ failure"
          {
            echo "## 🧪 Desktop Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Cargo test (Windows) | $(icon "$TEST_RESULT") |"
            echo "| Coverage (Linux, llvm-cov) | $(icon "$COVERAGE_RESULT") |"
            echo "| Build frontend exe → desktop app (Windows) | $(icon "$BUILD_RESULT") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Desktop Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [workflow run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md
          cat pr-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set final status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$CONCLUSION" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $CONCLUSION" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về caller repo qua createDispatchEvent 'test-report'; workflow test-report.yml
      # ở caller repo đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN
      # (github-actions[bot]).
      - name: Send report to caller repo
        if: env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 desktop-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // Dispatch event giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'desktop-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/${owner}/${repo}/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">${owner}/${repo}#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading(`🧪 Test report → ${repo}`, 3).addTable(rows).write();
            core.info(`Report sent to ${owner}/${repo} (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);

  # Build app Desktop đầy đủ (song song với job test), đúng thứ tự pipeline phát hành:
  #   1. Build FE thành `work-management-frontend.exe` (next-bun-compile, scripts/build-next-for-desktop.ts)
  #   2. Chuẩn bị sidecars + `tauri build` (bộ cài NSIS, không ký) — cần exe của bước 1 trong resources/.
  # Kết quả báo bằng commit status riêng "Desktop Build" trên commit của repo gọi.
  build:
    name: Build Desktop App
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      HEAD_SHA: ${{ needs.resolve.outputs.ref }}
      SOURCE_REPO: ${{ needs.resolve.outputs.source_repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MAIN_REPO: ${{ needs.resolve.outputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Build
      SIDECAR_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    steps:
      - name: Resolve source repository
        id: source
        env:
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository || github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi
          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Build Desktop App in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Nhánh frontend (frontend mới dùng bun + next-bun-compile, hiện chỉ có trên `dev`):
      # - nguồn là frontend → đúng commit đó;
      # - nhánh desktop: lấy từ PR, từ input/payload, hoặc nhánh đang trỏ vào commit (push không kèm
      #   tên nhánh) → frontend cùng tên nếu có; nhánh desktop khác `main` → frontend `dev`; còn lại `main`.
      - name: Resolve frontend ref
        id: fe-ref
        env:
          READ_TOKEN: ${{ steps.read-token.outputs.token }}
          REPORT_TOKEN: ${{ steps.report-token.outputs.token }}
          INPUT_BRANCH: ${{ github.event.client_payload.branch || inputs.branch || '' }}
        run: |
          set -euo pipefail
          FE_REPO=phu-nam-hai-jsco/work-management-frontend
          if [ "$SOURCE_REPO" = "$FE_REPO" ]; then
            echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"; echo "frontend ref: $HEAD_SHA (nguồn là frontend)"; exit 0
          fi
          BRANCH="$INPUT_BRANCH"
          if [ -n "$PR_NUMBER" ]; then
            BRANCH=$(GH_TOKEN="$REPORT_TOKEN" gh api "repos/$MAIN_REPO/pulls/$PR_NUMBER" --jq .head.ref 2>/dev/null || echo "$BRANCH")
          fi
          if [ -z "$PR_NUMBER" ] && [ -n "$HEAD_SHA" ]; then
            # Không có PR: nhánh nào đang trỏ vào commit này (push không kèm tên nhánh, hoặc chạy tay với
            # input `branch` mặc định `main` nhưng SHA thuộc nhánh khác). Giữ nhánh được truyền nếu nó
            # trỏ vào commit; nếu không thì ưu tiên main, rồi dev, rồi nhánh đầu tiên tìm được.
            HEADS=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$MAIN_REPO/commits/$HEAD_SHA/branches-where-head" --jq '.[].name' 2>/dev/null || true)
            echo "nhánh trỏ vào $HEAD_SHA: $(echo $HEADS)"
            if [ -n "$HEADS" ] && ! printf '%s\n' "$HEADS" | grep -qxF "$BRANCH"; then
              for candidate in main dev $HEADS; do
                if printf '%s\n' "$HEADS" | grep -qxF "$candidate"; then BRANCH="$candidate"; break; fi
              done
            fi
          fi
          fe_has() { [ -n "$1" ] && GH_TOKEN="$READ_TOKEN" gh api "repos/$FE_REPO/branches/$1" --silent 2>/dev/null; }
          if fe_has "$BRANCH"; then
            REF="$BRANCH"
          elif [ "$BRANCH" != "main" ] && fe_has dev; then
            REF=dev
          else
            REF=main
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "desktop branch: ${BRANCH:-<không rõ>} → frontend ref: $REF"

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (needs.resolve.outputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && needs.resolve.outputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      - name: Checkout Frontend Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/work-management-frontend
          ref: ${{ steps.fe-ref.outputs.ref }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: frontend

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Bun, Next.js & Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            frontend/.next/cache
            ~/.cargo/registry
            ~/.cargo/git
            desktop/artifacts/target
          key: ${{ runner.os }}-desktop-build-${{ hashFiles('desktop/Cargo.lock', 'desktop/bun.lock', 'frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-build-

      - name: Install dependencies
        id: install
        env:
          FE_REF: ${{ steps.fe-ref.outputs.ref }}
        run: |
          # Frontend cho Desktop phải cài bằng bun (bun.lock + next-bun-compile). Không có bun.lock thì
          # `bun install` sẽ lặng lẽ chuyển đổi pnpm-lock.yaml và build hỏng ở bước sau.
          if [ ! -f frontend/bun.lock ]; then
            echo "::error::Frontend '$FE_REF' chưa chuyển sang bun (không có bun.lock) — không build được frontend exe. Merge nhánh dùng bun (dev) vào '$FE_REF' hoặc tạo nhánh frontend cùng tên với nhánh desktop."
            exit 1
          fi
          # `--production` không cài devDependencies (husky) nhưng vẫn chạy script `prepare: husky`
          # → "command not found". Build CI không cần git hook nên bỏ script này trước khi cài.
          (cd frontend && bun pm pkg delete scripts.prepare && bun install --frozen-lockfile --production)
          (cd desktop && bun install --frozen-lockfile)
          test -f frontend/node_modules/next-bun-compile/dist/index.js \
            || { echo "::error::Frontend '$FE_REF' thiếu next-bun-compile sau khi bun install."; exit 1; }

      # Bước 1: FE → work-management-frontend.exe (bắt buộc có trước khi build app).
      - name: Build frontend exe
        id: build_fe
        working-directory: desktop
        env:
          NEXT_PUBLIC_QLCV_BUILD_CHANNEL: production
        run: |
          bun run build:next:desktop
          test -f resources/work-management-frontend.exe
          ls -lh resources/work-management-frontend.exe

      # Bước 2: sidecars + tauri build (giống scripts/build-desktop.ts, bỏ beforeBuildCommand vì FE đã build).
      - name: Build desktop app
        id: build_app
        working-directory: desktop
        run: |
          set -euo pipefail
          bun scripts/prepare-sidecars.ts "$SIDECAR_TARGET"
          SIDECAR_CONF=$(bun scripts/sidecar-bundle-config.ts "$SIDECAR_TARGET" | tail -n 1)
          # CI chỉ kiểm tra build: bỏ beforeBuildCommand (FE đã build ở bước 1) và tắt updater
          # artifacts (cần TAURI_SIGNING_PRIVATE_KEY, chỉ có ở pipeline phát hành).
          echo '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}' \
            > "$RUNNER_TEMP/tauri-ci-override.json"
          bunx tauri build \
            --config tauri.conf.json \
            --config tauri.bundle.merge.json \
            --config "$SIDECAR_CONF" \
            --config "$RUNNER_TEMP/tauri-ci-override.json"
          ls -lh artifacts/target/release/bundle/nsis/

      - name: Upload installer
        if: steps.build_app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: desktop/artifacts/target/release/bundle/nsis/*.exe
          retention-days: 3
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD_FE: ${{ steps.build_fe.outcome }}
          BUILD_APP: ${{ steps.build_app.outcome }}
          FE_REF: ${{ steps.fe-ref.outputs.ref }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          {
            echo "## 🏗️ Desktop Build"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install dependencies | $(icon "$INSTALL") |"
            echo "| Build frontend exe (frontend \`$FE_REF\`) | $(icon "$BUILD_FE") |"
            echo "| Build desktop app (tauri build) | $(icon "$BUILD_APP") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set final status on caller repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"
