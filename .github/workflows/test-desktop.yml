name: Test Desktop (Rust)
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# run-name: workflow gọi · repo gọi · PR/ref · trigger — nhìn là biết nguồn chạy.
run-name: "${{ github.workflow }} · ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      caller_run_url:
        description: 'Caller workflow run URL (shown in the report footer)'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần test (mặc định: repo caller; dispatcher truyền source)'
        type: string
        required: false
        default: ''
      coverage_gist_id:
        description: 'Gist id để cập nhật badge coverage (chỉ chạy trên main)'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] PAT with repo scope to checkout private submodules + main repo'
        required: false
      MAIN_REPO_PR_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] Optional PAT (contents:write + statuses:write trên caller repo) để set commit status / gửi báo cáo test-report'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: '[Không còn dùng — đã thay bằng GitHub App token] Optional PAT fallback cho checkout'
        required: false
      GIST_TOKEN:
        description: 'Optional PAT để cập nhật badge coverage (gist)'
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    # Windows: bản phát hành desktop chạy trên Windows (kho khoá = Credential Manager), nên test ở đây.
    runs-on: windows-latest
    timeout-minutes: 60
    # Các bước `run:` dùng cú pháp bash (Git Bash có sẵn trên runner Windows).
    defaults:
      run:
        shell: bash
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HAS_GIST_TOKEN: ${{ secrets.GIST_TOKEN != '' }}
      # Coverage chỉ cần khi có PR để comment, hoặc khi chạy trên main để cập nhật badge
      WITH_COVERAGE: ${{ inputs.pr_number != '' || inputs.ref == 'main' }}
      # Caller repo context (reusable workflow chạy với context của caller)
      MAIN_REPO: ${{ inputs.source_repository || github.repository }}
      STATUS_CONTEXT: Desktop Test
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
    steps:
      # Token ngắn hạn từ GitHub App (giống claude.yml), thay cho PAT.
      # - read-token: đọc repo nguồn + submodule (contents: read).
      # - report-token: chỉ repo nguồn; đặt commit status và gửi repository_dispatch.
      - name: Resolve source repository
        id: source
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REPOSITORY" =~ ^(TanNhatCMS|phu-nam-hai-jsco)/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Source repository is not allowed."
            exit 1
          fi

          echo "owner=${SOURCE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${SOURCE_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Create read token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          permission-contents: read

      - name: Create report token
        id: report-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.name }}
          permission-contents: write
          permission-statuses: write
      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Run Tests in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo caller repo đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && inputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'desktop-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout Desktop Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-desktop
          ref: ${{ (inputs.source_repository == 'phu-nam-hai-jsco/task-manager-desktop' && inputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: desktop

      - name: Checkout Frontend Repository
        uses: actions/checkout@v7
        with:
          repository: phu-nam-hai-jsco/task-manager-frontend
          ref: ${{ (inputs.source_repository == 'phu-nam-hai-jsco/task-manager-frontend' && inputs.ref) || 'main' }}
          fetch-depth: 1
          token: ${{ steps.read-token.outputs.token }}
          path: frontend

      # Windows: WebView2 và toolchain MSVC có sẵn trên runner, không cần cài thêm thư viện hệ thống.

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect layout
        run: |
          # Desktop repo duoc checkout tai path desktop/ (siblings: desktop/ + frontend/)
          echo "DESKTOP_ROOT=desktop" >> "$GITHUB_ENV"
          # tauri.conf frontendDist ../frontend/dist (tu desktop/) = workspace/frontend/dist
          echo "FRONTEND_DIST=$GITHUB_WORKSPACE/frontend/dist" >> "$GITHUB_ENV"

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (desktop)
        id: install
        working-directory: ${{ env.DESKTOP_ROOT }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend static export
        id: build_ui
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          NEXT_TAURI_STATIC_EXPORT: '1'
        run: |
          # tauri-next-static.ts chay `next build` trong ../frontend (sibling)
          # voi NEXT_TAURI_STATIC_EXPORT=1 -> static export vao ../frontend/dist
          # = dung path frontendDist cua tauri.conf -> generate_context thay that.
          bun scripts/tauri-next-static.ts
          test -f ../frontend/dist/index.html && echo "FE static export OK"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: env.WITH_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.DESKTOP_ROOT }}/artifacts/target
            ${{ env.DESKTOP_ROOT }}/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(format('{0}/Cargo.lock', env.DESKTOP_ROOT)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        id: tests
        if: env.WITH_COVERAGE != 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: cargo test --all-features

      - name: Run tests with coverage
        id: tests_cov
        if: env.WITH_COVERAGE == 'true'
        working-directory: ${{ env.DESKTOP_ROOT }}
        env:
          RUSTFLAGS: ''
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --cobertura --output-path coverage/desktop-coverage.xml

      # irongut/CodeCoverageSummary là Docker action nên không chạy được trên runner Windows:
      # tự dựng báo cáo markdown từ Cobertura (cùng định dạng, ngưỡng 50/75) để PR report dùng lại.
      - name: Code Coverage Summary
        id: coverage
        if: env.WITH_COVERAGE == 'true'
        run: |
          python - "$DESKTOP_ROOT/coverage/desktop-coverage.xml" <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          LOW, HIGH = 50, 75

          def health(pct):
              return '✔' if pct >= HIGH else ('➖' if pct >= LOW else '❌')

          root = ET.parse(sys.argv[1]).getroot()
          total_pct = float(root.get('line-rate', '0')) * 100
          covered, valid = 0, 0
          rows = []
          for pkg in root.iter('package'):
              lines = [l for l in pkg.iter('line')]
              valid_p = len(lines)
              covered_p = sum(1 for l in lines if int(l.get('hits', '0')) > 0)
              covered += covered_p
              valid += valid_p
              pct = (covered_p / valid_p * 100) if valid_p else 0
              rows.append((pkg.get('name', ''), pct))
          # Ưu tiên số liệu tổng của file; nếu thiếu thì dùng tổng các package.
          if root.get('lines-valid'):
              covered, valid = int(root.get('lines-covered', covered)), int(root.get('lines-valid', valid))
          pct_int = int(total_pct)
          color = 'success' if total_pct >= HIGH else ('yellow' if total_pct >= LOW else 'critical')
          out = [
              f'![Code Coverage](https://img.shields.io/badge/Code%20Coverage-{pct_int}%25-{color}?style=flat)',
              '',
              'Package | Line Rate | Health',
              '-------- | --------- | ------',
          ]
          for name, pct in sorted(rows):
              out.append(f'{name} | {int(pct)}% | {health(pct)}')
          out.append(f'**Summary** | **{pct_int}%** ({covered} / {valid}) | {health(total_pct)}')
          with open('code-coverage-results.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(out) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'percentage={total_pct:.1f}\n')
          print(f'Desktop Coverage: {total_pct:.1f}%')
          PY

      - name: Update coverage badge (Gist)
        if: inputs.ref == 'main' && inputs.coverage_gist_id != '' && env.HAS_GIST_TOKEN == 'true'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ inputs.coverage_gist_id }}
          filename: desktop-coverage.json
          label: Desktop coverage
          message: '${{ steps.coverage.outputs.percentage }}%'
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

      - name: Upload coverage reports
        if: always() && env.WITH_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-reports
          path: ${{ env.DESKTOP_ROOT }}/coverage/desktop-coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build PR report
        if: always() && env.PR_NUMBER != ''
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ inputs.trigger }}
          CALLER_RUN_URL: ${{ inputs.caller_run_url }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD_UI: ${{ steps.build_ui.outcome }}
          TESTS: ${{ steps.tests_cov.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$JOB_STATUS" = "success" ] && RESULT="✅ Passed" || RESULT="❌ $JOB_STATUS"
          {
            echo "## 🧪 Desktop Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install dependencies | $(icon "$INSTALL") |"
            echo "| Build Tauri UI | $(icon "$BUILD_UI") |"
            echo "| Cargo test (llvm-cov) | $(icon "$TESTS") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Desktop Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [workflow run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md

      - name: Set final status on caller repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ steps.report-token.outputs.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về caller repo qua createDispatchEvent 'test-report'; workflow test-report.yml
      # ở caller repo đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN
      # (github-actions[bot]).
      - name: Send report to caller repo
        if: always() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ steps.report-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.MAIN_REPO.split('/');
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 desktop-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // Dispatch event giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: owner,
              repo: repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'desktop-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/${owner}/${repo}/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">${owner}/${repo}#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading(`🧪 Test report → ${repo}`, 3).addTable(rows).write();
            core.info(`Report sent to ${owner}/${repo} (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);
