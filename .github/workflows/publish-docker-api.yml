name: Docker Publish API Build
run-name: "${{ github.workflow }} · ${{ github.sha }}"
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# Build image API (.NET) từ `docker/dotnet/Dockerfile` (COPY `server/**`) của caller repo.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      version:
        description: 'Version to tag the image with (fallback: server/package.json → server/version.build.yml → server/build/api.build.yml → 1.0.0-dev)'
        type: string
        required: false
        default: ''
      source_repository:
        description: 'Repo chứa source cần build (mặc định: repo caller; task-manager-packages truyền task-manager)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Branch name for image lane tagging (default: main lane, no prefix)'
        type: string
        required: false
        default: 'main'
    secrets:
      SUBMODULE_TOKEN:
        description: 'PAT with repo scope to checkout private submodules + main repo'
        required: false
      GHCR_TOKEN:
        description: 'Optional PAT with write:packages to push to GHCR (fallback: MAIN_REPO_CHECKOUT_TOKEN, then GITHUB_TOKEN)'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: 'Optional PAT fallback for checkout + GHCR login'
        required: false
      MEDIATR_LICENSE_KEY:
        description: 'Optional MediatR license key baked into the API image (MEDIATR__LICENSEKEY build arg)'
        required: false

# Group theo image + nguồn build (repo/branch/ref/version/PR): các image khác nhau
# (server/web/migrator) hoặc lane khác nhau chạy SONG SONG. `github.workflow` trong
# reusable workflow là tên workflow của caller nên không dùng làm key; chỉ hủy run
# trùng hệt cùng một build.
concurrency:
  group: publish-docker-api-${{ inputs.source_repository || github.repository }}-${{ inputs.branch }}-${{ inputs.ref || github.sha }}-${{ inputs.version }}-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Ảnh publish về namespace của caller repo (GITHUB_TOKEN + packages:write đủ quyền push)
  OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Build API chỉ cần 2 repo: server (mã nguồn .NET) và docker (Dockerfile + entrypoint).
      # Không checkout repo chính task-manager + submodules recursive (frontend/desktop/database... không dùng).
      # Vẫn giữ đúng commit mà repo chính đã ghim cho 2 submodule tại `ref` (đọc qua Contents API).
      - name: Resolve pinned commits of server + docker
        id: pins
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}
          SRC_REPO: ${{ inputs.source_repository || github.repository }}
          SRC_REF: ${{ inputs.ref || github.sha }}
        run: |
          for m in server docker; do
            info=$(gh api "repos/${SRC_REPO}/contents/${m}?ref=${SRC_REF}" --jq '[.type, .sha, .submodule_git_url] | @tsv')
            type=$(echo "$info" | cut -f1); sha=$(echo "$info" | cut -f2); url=$(echo "$info" | cut -f3)
            if [ "$type" != "submodule" ] || [ -z "$sha" ] || [ -z "$url" ]; then
              echo "::error::'${m}' tại ${SRC_REPO}@${SRC_REF} không phải submodule hợp lệ (type=${type})"
              exit 1
            fi
            repo=$(echo "$url" | sed -E 's#^https://github.com/##; s#\.git$##')
            echo "${m}_repo=${repo}" >> "$GITHUB_OUTPUT"
            echo "${m}_sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "${m}: ${repo}@${sha}"
          done

      - name: Checkout server
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.server_repo }}
          ref: ${{ steps.pins.outputs.server_sha }}
          path: server
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Checkout docker
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.docker_repo }}
          ref: ${{ steps.pins.outputs.docker_sha }}
          path: docker
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}

      # Context build là thư mục gốc workspace: loại .git của 2 repo con khỏi context
      - name: Exclude .git from build context
        run: printf '**/.git\n' > .dockerignore

      - name: Resolve version
        id: version
        run: |
          RAW_VERSION=""
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VERSION="${{ inputs.version }}"
            echo "Source: workflow input"
          elif [ -f "server/package.json" ] && [ -n "$(node -p "require('./server/package.json').version || ''" 2>/dev/null)" ]; then
            # Nguồn chuẩn của backend (dotnet -p:Version + ENV QLCV__Version trong image)
            RAW_VERSION=$(node -p "require('./server/package.json').version")
            echo "Source: server/package.json"
          elif [ -f "server/version.build.yml" ]; then
            RAW_VERSION=$(grep -E '^[[:space:]]*version:' server/version.build.yml | head -n1 | sed -E 's/^[[:space:]]*version:[[:space:]]*["'\'']?([^"'\'']+)["'\'']?/\1/' | tr -d '[:space:]')
            echo "Source: server/version.build.yml"
          elif [ -f "server/build/api.build.yml" ]; then
            RAW_VERSION=$(grep -E '^[[:space:]]*version:' server/build/api.build.yml | head -n1 | sed -E 's/^[[:space:]]*version:[[:space:]]*["'\'']?([^"'\'']+)["'\'']?/\1/' | tr -d '[:space:]')
            echo "Source: server/build/api.build.yml"
          fi

          # Chuẩn hóa version: bỏ 'v' ở đầu nếu có (vd: v2.9.6 -> 2.9.6)
          VERSION=$(echo "$RAW_VERSION" | sed -E 's/^v//')

          # Nếu rỗng hoặc không đúng định dạng SemVer/version .NET (vd: chỉ là chữ 'dev'), fallback về 1.0.0-dev
          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*'; then
            VERSION="1.0.0-dev"
            echo "Version normalized to valid SemVer: $VERSION"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Resolve lane prefix
        id: lane
        run: |
          BRANCH="${{ inputs.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ]; then
            # Dev lane: suffix vao TEN image (task-manager-server-dev), tag giu sach
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "name_suffix=-dev" >> $GITHUB_OUTPUT
          else
            echo "prefix=${BRANCH}-" >> $GITHUB_OUTPUT
            echo "suffix=-${BRANCH}" >> $GITHUB_OUTPUT
            echo "name_suffix=" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-server${{ steps.lane.outputs.name_suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/task-manager-packages
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest${{ steps.lane.outputs.suffix }}
            type=raw,value=${{ steps.version.outputs.version }}${{ steps.lane.outputs.suffix }}
            type=sha,prefix=${{ steps.lane.outputs.prefix }}sha-,format=short

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dotnet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-server${{ steps.lane.outputs.name_suffix }}:latest${{ steps.lane.outputs.suffix }}
            type=gha,scope=publish-api
          cache-to: type=gha,mode=max,scope=publish-api
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT_HASH=${{ inputs.ref || github.sha }}
            MEDIATR__LICENSEKEY=${{ secrets.MEDIATR_LICENSE_KEY }}

      - name: Summary
        run: |
          echo "## 🐳 API Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/task-manager-server${{ steps.lane.outputs.name_suffix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ inputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
